<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!-- i3's title renderer mis-scales the installed color emoji fonts.
       Use a conventional outline font in i3 only. -->
  <match target="pattern">
    <test name="prgname" compare="eq">
      <string>i3</string>
    </test>
    <test name="family" compare="contains">
      <string>Noto Color Emoji</string>
    </test>
    <edit name="family" mode="assign" binding="strong">
      <string>Symbola</string>
    </edit>
    <!-- The emoji-script language preference otherwise outweighs Symbola
         during font matching. -->
    <edit name="lang" mode="assign" binding="strong">
      <string>en</string>
    </edit>
  </match>
</fontconfig>
