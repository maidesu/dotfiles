[icons]
icons = "none"

[theme]
theme = "plain"
[theme.overrides]
separator = " | "

[[block]]
block = "cpu"
interval = 5
format = "CPU: $barchart $utilization.eng(w:3)"

[[block]]
block = "load"
interval = 5
format = "Load: $1m.eng(w:4)"

[[block]]
block = "memory"
interval = 5
format = "RAM: $mem_used.eng(w:4,p:Gi) / $mem_total.eng(w:4,p:Gi)"
format_alt = "SWP: $swap_used.eng(w:4,p:Gi) / $swap_total.eng(w:4,p:Gi)"

[[block]]
block = "battery"
device = "BAT0"
interval = 15
format = "Bat: $percentage.eng(w:3){ $time_remaining.duration(hms:true, min_unit:m)|}"
charging_format = "Bat: $percentage.eng(w:3){ $time_remaining.duration(hms:true, min_unit:m)|}"
full_format = "Bat: $percentage.eng(w:3){ $time_remaining.duration(hms:true, min_unit:m)|}"
not_charging_format = "Bat: $percentage.eng(w:3){ $time_remaining.duration(hms:true, min_unit:m)|}"
missing_format = ""

[[block]]
block = "battery"
model = "Wacom Intuos Pro S"
interval = 15
format = "Tab: $percentage.eng(w:3){ $time_remaining.duration(hms:true, min_unit:m)|}"
charging_format = "Tab: $percentage.eng(w:3){ $time_remaining.duration(hms:true, min_unit:m)|}"
full_format = "Tab: $percentage.eng(w:3){ $time_remaining.duration(hms:true, min_unit:m)|}"
not_charging_format = "Tab: $percentage.eng(w:3){ $time_remaining.duration(hms:true, min_unit:m)|}"
missing_format = ""

[[block]]
block = "battery"
model = "PRO X2 SUPERSTRIKE"
interval = 15
format = "Mse: $percentage.eng(w:3){ $time_remaining.duration(hms:true, min_unit:m)|}"
charging_format = "Mse: $percentage.eng(w:3){ $time_remaining.duration(hms:true, min_unit:m)|}"
full_format = "Mse: $percentage.eng(w:3){ $time_remaining.duration(hms:true, min_unit:m)|}"
not_charging_format = "Mse: $percentage.eng(w:3){ $time_remaining.duration(hms:true, min_unit:m)|}"
missing_format = ""

[[block]]
block = "sound"
driver = "auto"
step_width = 5
max_vol = 150
format = "Vol: {$volume.eng(w:3)|mute}"

[[block]]
block = "time"
interval = 1
format = "$timestamp.datetime(f:'%Y.%m.%d. %H:%M:%S')"
