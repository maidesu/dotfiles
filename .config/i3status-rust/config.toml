[icons]
icons = "none"

[theme]
theme = "plain"
[theme.overrides]
separator = " | "

[[block]]
block = "custom"
command = '''
show="$(bluetoothctl show 2>/dev/null)"
if [ -z "$show" ]; then
    printf '{"text":"none"}\n'
elif ! printf "%s\n" "$show" | grep -q "Powered: yes"; then
    printf '{"text":"down"}\n'
else
    count="$(bluetoothctl devices Connected 2>/dev/null | awk 'END { print NR }')"
    if [ "$count" -gt 0 ]; then
        printf '{"text":"%s"}\n' "$count"
    else
        printf '{"text":"up"}\n'
    fi
fi
'''
json = true
interval = 5
format = "BT: $text.str(width:4)"

[[block]]
block = "net"
device = "^(wl|wlan|wlp|wlo)"
interval = 5
format = "WiFi: $ssid.str(max_w:12) $signal_strength.eng(w:3,u:%) $speed_down.eng(w:5,u:b,p:K)↓ $speed_up.eng(w:5,u:b,p:K)↑"
inactive_format = "WiFi: down"
missing_format = ""

[[block]]
block = "net"
device = "^(en|eth)"
interval = 10
format = "Eth: $speed_down.eng(w:5,u:b,p:K)↓ $speed_up.eng(w:5,u:b,p:K)↑"
inactive_format = "Eth: down"
missing_format = ""

[[block]]
block = "cpu"
interval = 5
format = "CPU: $barchart $utilization.eng(w:3,u:%)"

[[block]]
block = "load"
interval = 5
format = "Load: $1m.eng(w:4)"

[[block]]
block = "memory"
interval = 5
format = "RAM: $mem_used.eng(w:4,u:B,p:Gi) / $mem_total.eng(w:4,u:B,p:Gi)"
format_alt = "SWP: $swap_used.eng(w:4,u:B,p:Gi) / $swap_total.eng(w:4,u:B,p:Gi)"

[[block]]
block = "nvidia_gpu"
interval = 5
format = "GPU: $utilization.eng(w:3,u:%) $memory.eng(w:5,u:B,p:Mi)"

[[block]]
block = "disk_space"
interval = 20
path = "/"
info_type = "available"
format = "/: $available.eng(w:4,u:B,p:Gi)"

[[block]]
block = "disk_space"
interval = 20
path = "/home"
info_type = "available"
format = "/home: $available.eng(w:4,u:B,p:Gi)"

[[block]]
block = "disk_space"
interval = 20
path = "/var"
info_type = "available"
format = "/var: $available.eng(w:4,u:B,p:Gi)"

